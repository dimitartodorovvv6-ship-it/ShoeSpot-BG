ents, modern design system, fullscreen presentation mode, and keyboard navigation for polished presentations.\n\n## Technical Features\n\n- Fixed 1920x1080 resolution with automatic scaling\n- Sidebar thumbnail navigation\n- Fullscreen presentation mode with keyboard controls\n- Progress indicators and zoom controls\n- Mobile-responsive layouts\n- Keyboard navigation (arrow keys, Space, Escape)\n\n## Use This Template\n\nStart with 6 pre-built example slides showing what's possible:\n1. Title slide with gradient background\n2. Interactive charts and simulations\n3. Real-time calculations and metrics\n4. 3D object viewer\n5. Custom interactive components\n6. Call-to-action slide\n\nCustomize everything—colors, content, interactions, and components to match your needs.\n"])</script><script nonce="">self.__next_f.push([1,"3a:Tfd3,"])</script><script nonce="">self.__next_f.push([1,"\nThis template gives you a complete asset management system for tracking company equipment from purchase to retirement. Log every piece of hardware with purchase details, condition notes, serial numbers, and categories. Assign assets to employees and maintain a full assignment history.\n\nAssetWise automatically calculates straight-line depreciation based on purchase cost, useful life, and residual value. The dashboard shows real-time metrics including total asset value, current book value, condition breakdowns, and recent activity.\n\nThe built-in AI chat assistant lets you ask natural language questions about your inventory — find assets by category, check who has what, or analyze depreciation trends. Bulk import assets via CSV or add them one at a time through the form interface.\n\nAuthentication is built in with email-based signup, login, and password reset. Row-level security ensures each authenticated user's data is protected. An admin role system supports granular access control across all tables.\n\n## Who This Is For\n\nIT managers tracking hardware assignments across departments and remote teams\n\nOffice managers keeping inventory of furniture, equipment, and supplies\n\nOperations teams monitoring asset condition, depreciation, and replacement schedules\n\nFinance teams needing accurate book value calculations for reporting\n\nStartup founders managing a growing equipment inventory without dedicated tools\n\n## Best Use Cases\n\n### IT Equipment Tracking\n\nTrack laptops, monitors, phones, and peripherals across your organization. Assign devices to employees, monitor condition, and know exactly when assets are due for replacement based on depreciation schedules.\n\n### Office Asset Management\n\nMaintain a complete inventory of office furniture, appliances, and shared equipment. Log purchase details, track condition over time, and plan budgets using depreciation data.\n\n### Depreciation Reporting\n\nAutomatically calculate straight-line depreciation for every asset. View current book values, percentage depreciated, and fully depreciated items. Export data for financial reporting.\n\n### Employee Onboarding and Offboarding\n\nSee which assets are assigned to each employee at a glance. When someone joins or leaves, quickly reassign equipment and maintain a full assignment history with dates and notes.\n\n## Getting Started\n\n### Step 1: Remix This Template\n\nClick \"Remix\" to create your copy. You'll have a working asset management app you can explore before adding your own data.\n\n### Step 2: Familiarize Yourself With the Project\n\nGo to User \u003e Settings \u003e Knowledge, and read what's under \"Project knowledge\" to understand the intended architecture and access control model. You can also ask Lovable in the chat for more details.\n\n### Step 3: Customize Your Brand\n\nUpdate colors, fonts, and your company name. The design system uses semantic tokens so you can adjust the look across the entire app from a single file.\n\n### Step 4: Add Your Assets\n\nEnter equipment details including name, category, purchase cost, purchase date, condition, and serial number. Use the CSV import to bulk-load existing inventory data.\n\n### Step 5: Add Employees and Assign Assets\n\nCreate employee records with name, department, and email. Then assign assets to employees with assignment dates and notes.\n\n### Step 6: Go Live\n\nDeploy with one click and share with your team. Lovable handles hosting and performance.\n\n### Step 7: Iterate and Make It Yours\n\nContinue building and make any changes to the app to suit your team's exact preferences and workflows.\n\n## Conclusion\n\nThis asset management template works for IT managers, office managers, and operations teams who need full visibility into company equipment. You get a real-time dashboard, depreciation tracking, employee assignments, AI-powered search, and CSV import/export in a template you can deploy in minutes. Whether you're tracking laptops across a distributed team or managing office furniture depreciation schedules, AssetWise replaces the spreadsheet you've been maintaining manually.\n"])</script><script nonce="">self.__next_f.push([1,"3b:T1295,"])</script><script nonce="">self.__next_f.push([1,"\nEventSpark is a full-stack event registration platform, not just a landing page. Organizers sign up, create events through a guided three-step wizard (details → branding → form fields), and publish branded registration pages that attendees can fill out without logging in.\n\nThe dashboard gives organizers a central hub to manage all their events — view attendee lists, track registration analytics, generate QR codes, and edit event details. Each event gets a unique slug-based registration URL that can be shared anywhere.\n\nThe registration page supports five template layouts (minimal, split screen, stacked, landing page, and card grid) with customizable brand colors and light/dark mode. Attendees see a confirmation screen after registering, and organizers get a clean attendee record in their dashboard.\n\nA public company page lets organizers showcase all their live events under one branded URL with social links and company info. The settings page handles profile management, company branding, team invitations, and theme preferences.\n\nEventSpark works for conferences, meetups, webinars, workshops, and product launches. It's designed as a self-serve template where teams have full visibility across all events and data.\n\n## Who This Is For\n\nMarketing teams launching registration pages for conferences, webinars, or product launches\n\nDeveloper relations teams promoting meetups and community events\n\nStartups hosting product demos or launch events without a dedicated events platform\n\nEducators and trainers setting up workshop or course registration pages\n\nNonprofits and community organizers running events that need a professional online presence\n\nTeams that need shared visibility across all events and attendee data\n\n## Best Use Cases\n\n### Tech Conference or Meetup\n\nCreate a branded registration page with your choice of template layout, upload your event flyer, and share the link or QR code. The dashboard tracks all registrations and the analytics page shows trends over time.\n\n### Product Launch or Demo Day\n\nBuild a polished registration page with the landing page or split screen template. Set capacity limits, customize form fields to capture lead info, and manage all sign-ups from the attendees dashboard.\n\n### Webinar Series\n\nCreate individual events for each session with unique registration pages. The public company page lists all your live events in one place, making it easy for attendees to discover and register for upcoming sessions.\n\n### Workshop or Training Session\n\nSet up a registration page with session details and a form that collects participant-specific information. Use the QR code feature for in-person promotion and track registrations in real time from the dashboard.\n\n## Getting Started\n\n### Step 1: Remix This Template\n\nClick \"Remix\" to create your copy. You'll
